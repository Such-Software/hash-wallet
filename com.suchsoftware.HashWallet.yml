app-id: com.suchsoftware.HashWallet
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: hash_wallet
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --filesystem=home
modules:
  - name: hash_wallet
    buildsystem: simple
    build-commands:
      - "cp -R bundle /app/hash_wallet"
      - "chmod +x /app/hash_wallet/hash_wallet"
      - "mkdir -p /app/bin"
      - "ln -s /app/hash_wallet/hash_wallet /app/bin/hash_wallet"
      - "mkdir -p /app/share/icons/hicolor/scalable/apps"
      - "cp cakewallet_icon_180.png /app/share/icons/hicolor/scalable/apps/com.suchsoftware.HashWallet.png"
      - "mkdir -p /app/share/applications"
      - "cp com.suchsoftware.HashWallet.desktop /app/share/applications"
    sources:
      - type: dir
        path: build/linux/x64/release
      - type: file
        path: assets/images/cakewallet_icon_180.png
      - type: file
        path: linux/com.suchsoftware.HashWallet.desktop
