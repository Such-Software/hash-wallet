<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Hash Bags loading pulse</title>
<desc>Looping loading animation: green-boxed hash mark pulses opacity, suggesting a hash-computing rhythm.</desc>

<rect x="20" y="20" width="160" height="160" rx="36" fill="#1a5c38">
  <animate attributeName="opacity"
    values="0.4; 1; 0.4"
    keyTimes="0; 0.5; 1"
    dur="1.4s" repeatCount="indefinite"/>
</rect>

<text x="100" y="148" font-family="ui-monospace, 'JetBrains Mono', 'Courier New', monospace" font-size="140" font-weight="700" fill="#ffffff" text-anchor="middle">
  #
  <animate attributeName="opacity"
    values="0.4; 1; 0.4"
    keyTimes="0; 0.5; 1"
    dur="1.4s" repeatCount="indefinite"/>
</text>
</svg>
