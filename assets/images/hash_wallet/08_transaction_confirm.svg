<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Hash Bags transaction confirm</title>
<desc>Transaction confirm animation: empty green-outlined box fills with brand green from bottom up, hash glyph appears at completion. Loops for pending state.</desc>

<defs>
  <clipPath id="boxclip">
    <rect x="20" y="20" width="160" height="160" rx="36"/>
  </clipPath>
</defs>

<!-- Empty outlined box -->
<rect x="20" y="20" width="160" height="160" rx="36" fill="none" stroke="#1a5c38" stroke-width="4"/>

<!-- Green fill rising from bottom, clipped to box shape -->
<g clip-path="url(#boxclip)">
  <rect x="20" width="160" fill="#1a5c38">
    <animate attributeName="y"
      values="180; 20; 20; 180"
      keyTimes="0; 0.55; 0.85; 1"
      dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="height"
      values="0; 160; 160; 0"
      keyTimes="0; 0.55; 0.85; 1"
      dur="2.4s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- Hash glyph appears when full, fades when draining -->
<text x="100" y="148" font-family="ui-monospace, 'JetBrains Mono', 'Courier New', monospace" font-size="140" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="0">
  #
  <animate attributeName="opacity"
    values="0; 0; 1; 1; 0"
    keyTimes="0; 0.5; 0.6; 0.8; 0.95"
    dur="2.4s" repeatCount="indefinite"/>
</text>
</svg>
