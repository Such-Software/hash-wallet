<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<title>Hash Wallet splash animation</title>
<desc>Splash screen: green rounded square scales in, then white hash glyph fades up.</desc>

<!-- Green box scales up from center -->
<rect x="20" y="20" width="160" height="160" rx="36" fill="#1a5c38" opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.3s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate"
    values="100 100; 0 0" keyTimes="0; 1"
    begin="0s" dur="0.5s" fill="freeze"
    keySplines="0.2 0.8 0.3 1" calcMode="spline"/>
  <animateTransform attributeName="transform" type="scale" additive="sum"
    values="0; 1.05; 1" keyTimes="0; 0.7; 1"
    begin="0s" dur="0.5s" fill="freeze"
    keySplines="0.2 0.8 0.3 1; 0.5 0 0.5 1" calcMode="spline"/>
</rect>

<!-- Hash glyph fades and scales in after box settles -->
<text x="100" y="148" font-family="ui-monospace, 'JetBrains Mono', 'Courier New', monospace" font-size="140" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="0">
  #
  <animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.35s" fill="freeze"/>
</text>
</svg>
