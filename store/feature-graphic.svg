<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1a12"/>
      <stop offset="0.55" stop-color="#0f2b1c"/>
      <stop offset="1" stop-color="#123f28"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.70" cy="0.30" r="0.65">
      <stop offset="0" stop-color="#2EA56A" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2EA56A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#glow)"/>

  <!-- Hash Bags mark -->
  <g transform="translate(104,130)">
    <rect width="240" height="240" rx="53" fill="#1a5c38"/>
    <text x="120" y="180" font-family="monospace" font-size="180" font-weight="700"
          fill="#ffffff" text-anchor="middle">#</text>
  </g>

  <!-- Wordmark + taglines -->
  <g transform="translate(404,0)">
    <text x="0" y="228" font-family="sans-serif" font-size="98" font-weight="700"
          fill="#e8efe9">Hash Bags</text>
    <text x="4" y="292" font-family="sans-serif" font-size="31" font-weight="500"
          fill="#8fd6b0">Open-source, non-custodial wallet</text>
    <text x="4" y="342" font-family="sans-serif" font-size="27" font-weight="400"
          fill="#7fae97">Wownero · Monero · Bitcoin · Litecoin · and more</text>
  </g>
